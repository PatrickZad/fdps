_BASE_: "../../ti_ddetr_baseline.yaml"
MODEL:
  META_ARCHITECTURE: "TiDDETR_C4Side"
  WEIGHTS: ""
  BACKBONE:
    NAME: "build_resnet_backbone_half"
    FREEZE_AT: 2
  RESNETS:
    OUT_FEATURES: ["res2","res3","res4","res5"]
    CHECKPOINT_AT: 4
DETECTOR:
  MODEL:
    IN_FEATS: ["res3","res4","res5"]
    NUM_FEAT_LEVELS: 4
    USE_CHECKPOINT: True  
    D_TRANSFORMER:
      DEC_DEPTH: 6
REID_HEAD:
  INIT_WEIGHT: "Data/model_zoo/tvR-50.pkl"
  POOL_LAYER: "gempoolP"
  TRAIN_WITH_DET: False
  USE_CHECKPOINT: True
  BOX_AUGMENTATION:
    ENABLE: True
    NAME: "dn_detr"
    H_CENTER: 0.4
    H_SCALE: 0.2
    NUM_LABELED: 5
    APPEND_GT: True
    NUM_UNLABLED: 5
  LOSS:
    OIM:
      LUT_LEN: 483
      QUEUE_LEN: 500
CWS: False
SOLVER:
  OPTIM: SGD
  MAX_ITER: 34231 # 1141 * 30 +1
  STEPS: (12551,) #(13692,) # 
  BASE_LR: 0.001
  IMS_PER_BATCH: 5
  CHECKPOINT_PERIOD: 1141
  WARMUP_ITERS: 1141
DATASETS:
  TRAIN: ("PRW_Train",) 
  TEST: ( "PRW_Gallery","PRW_InfQ",) #
TEST:
  EVAL_PERIOD: 1141
OUTPUT_DIR: "outputs/tips_next/tiddetr_c4side_prw"