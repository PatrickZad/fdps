_BASE_: "./ti_ddetr_baseline.yaml"
MODEL:
  META_ARCHITECTURE: "DDDETR_Baseline"
  BACKBONE:
    NAME: "build_resnet_backbone_half"
    FREEZE_AT: 2
  RESNETS:
    RES5_DILATION: 2
    CHECKPOINT_AT: 4
DETECTOR:
  MODEL:
    D_TRANSFORMER:
      ENC_DEPTH: 3
      DEC_DEPTH: 3
      DIM_FEEDFORWARD: 256
      USE_CHECKPOINT: True
DATASETS:
  TRAIN: ("CUHK-SYSU_Train",) 
  TEST: ("CUHK-SYSU_Gallery", ) #
SOLVER:
  MAX_ITER: 70001 # 700 * 100+1
  STEPS: (56000,)
  CHECKPOINT_PERIOD: 1400
  WARMUP_ITERS: 1400
  IMS_PER_BATCH: 16
  LR_FACTORS: [0.2,0.1,0.1]
TEST:
  EVAL_PERIOD: 1400
OUTPUT_DIR: "outputs/tips_next/cuhk_dddetr_dc5_h50"