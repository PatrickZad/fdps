MODEL:
  META_ARCHITECTURE: "TipsRcnnRnBase"
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl"
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]
  BACKBONE:
    NAME: "build_resnet_backbone"
    FREEZE_AT: 2
  RESNETS:
    DEPTH: 50
    NORM: "FrozenBN"
    RES2_OUT_CHANNELS: 256
    STRIDE_IN_1X1: False
    OUT_FEATURES: ["res4"]
  PROPOSAL_GENERATOR:
    NAME: "RPN"
  ANCHOR_GENERATOR:
    NAME: "DefaultAnchorGenerator"
    SIZES: [[32, 64, 128, 256, 512]]
    ASPECT_RATIOS: [[0.5, 1.0, 2.0]]
  RPN:
    HEAD_NAME: "StandardRPNHead" 
    IN_FEATURES: ["res4"]
    IOU_THRESHOLDS: [0.3, 0.7]
    BATCH_SIZE_PER_IMAGE: 256
    POSITIVE_FRACTION: 0.5
    PRE_NMS_TOPK_TRAIN: 12000
    PRE_NMS_TOPK_TEST: 6000
    POST_NMS_TOPK_TRAIN: 2000
    POST_NMS_TOPK_TEST: 300
    NMS_THRESH: 0.7
  ROI_HEADS:
    NAME: "Res5ROIHeads"
    NUM_CLASSES: 1
    IN_FEATURES: ["res4"]
    IOU_THRESHOLDS: [0.1, 0.5]
    IOU_LABELS: [0, -1, 1]
    BATCH_SIZE_PER_IMAGE: 128
    POSITIVE_FRACTION: 0.5
    SCORE_THRESH_TEST: 0.5
    NMS_THRESH_TEST: 0.4
    PROPOSAL_APPEND_GT: True
  ROI_BOX_HEAD:
      NAME: "" 
      BBOX_REG_LOSS_TYPE: "smooth_l1"
      BBOX_REG_LOSS_WEIGHT: 10.0
      BBOX_REG_WEIGHTS: [10.0, 10.0, 5.0, 5.0]
      SMOOTH_L1_BETA: 0.111111 
      POOLER_RESOLUTION: [16, 8]
      POOLER_SAMPLING_RATIO: 2
      POOLER_TYPE: "ROIAlignV2"
      BOX_NORM: ""
CWS: False
REID_HEAD:
  ROI_POOLER:
    TYPE: "ROIAlignV2"
    POOLER_RESOLUTION: [16,8]
    SAMP_RATIO: 2
    SCALES: [0.0625] # 1/16
  POOL_LAYER: "gempoolP"
  PERSON_FEATURE:
    DIM: 2048
  TRAIN_REID: True
  TRAIN_WITH_DET: False
  TRAIN_WITH_NMS: False
  BOX_AUGMENTATION:
    ENABLE: True
    NAME: "dn_detr"
    H_CENTER: 0.4
    H_SCALE: 0.2
    NUM_LABELED: 9
    APPEND_GT: True
    NUM_UNLABLED: 9
  LOSS:
    NAME: "oim"
    OIM:
      NORMALIZE: True
      LB_LAYER: "lb_norm"
      ULB_LAYER: "ulb_full"
      LUT_LEN: 1
      QUEUE_LEN: 1
      LB_FACTOR: 30
      ULB_FACTOR: 30
      SYNC: False
      FOCAL:
        USE_FOCAL: True
        FOCAL_ALPHA: 1
        FOCAL_GAMMA: 2
    LOSS_WEIGHTS:
      OIM: 1.0
  USE_CHECKPOINT: False
INPUT:
  MIN_SIZE_TRAIN: (480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800, 832, 864, 896, 900)
  MAX_SIZE_TRAIN: 1500
  MIN_SIZE_TEST: 900
  MAX_SIZE_TEST: 1500
  FORMAT: "RGB"
  SIZE_DIVISIBILITY: 32

DATALOADER:
  NUM_WORKERS: 8

SOLVER:
  LR_SCHEDULER_NAME: "WarmupMultiStepLR"
  BASE_LR: 0.001
  WEIGHT_DECAY: 1.0e-4
  GAMMA: 0.1
  IMS_PER_BATCH: 5

TEST:
  IMS_PER_PROC: 8
  DETECTIONS_PER_IMAGE: -1
# SEED: 42
VIS_PERIOD: 500
VERSION: 2