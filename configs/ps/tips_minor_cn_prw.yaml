_BASE_: "./frcnn_tips_base.yaml"
MODEL:
  META_ARCHITECTURE: "TipsRcnnCnOrd"
  WEIGHTS: "outputs/tips_next/frcnn_det_prw_cn_minor/model_final.pth"
  BACKBONE:
    NAME: "convnext_tiny_minor"
    FREEZE_AT: 1
  CONV_NEXT:
    OUT_FEATURES: ["stage1_unorm","stage2_unorm","stage3_unorm"]
    LAST_STRIDE: True
    PRETRAINED: True
    IN_22K: True
    CHECKPOINT_AT: 3
  RPN:
    IN_FEATURES: ["stage3_unorm"]
  ROI_HEADS:
    IN_FEATURES: ["stage3_unorm"]
REID_HEAD:
  LOSS:
    OIM:
      LUT_LEN: 483
      QUEUE_LEN: 500
SOLVER:
  MAX_ITER: 34231 # 1141 * 30 +1
  STEPS: (11410,) # 
  BASE_LR: 0.001
  IMS_PER_BATCH: 5
  CHECKPOINT_PERIOD: 1141
  WARMUP_ITERS: 1141
DATASETS:
  TRAIN: ("PRW_Train",) 
  TEST: ( "PRW_Gallery","PRW_InfQ",) #
TEST:
  EVAL_PERIOD: 1141
OUTPUT_DIR: "outputs/tips_next/tips_minor_cn_prw"