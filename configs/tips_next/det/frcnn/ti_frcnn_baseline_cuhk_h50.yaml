_BASE_: "./ti_frcnn_baseline.yaml"
MODEL:
  BACKBONE:
    NAME: "build_resnet_backbone_half"
    FREEZE_AT: 2
  ROI_HEADS:
    NAME: "Res5HalfROIHeads"
    IOU_THRESHOLDS: [0.5,]
    IOU_LABELS: [0, 1]
  ROI_BOX_HEAD:
    SMOOTH_L1_BETA: 1.0
DATASETS:
  TRAIN: ("CUHK-SYSU_Train",) 
  TEST: ("CUHK-SYSU_Gallery", ) #
SOLVER:
  MAX_ITER: 42001 # 700 * 60+1
  STEPS: (16800,33600)
  CHECKPOINT_PERIOD: 1400
  WARMUP_ITERS: 1400
  IMS_PER_BATCH: 16
TEST:
  EVAL_PERIOD: 1400
OUTPUT_DIR: "outputs/tips/cuhk_tircnn_h50"