_BASE_: "./frcnn_tips_base.yaml"
MODEL:
  META_ARCHITECTURE: "TipsRcnnCnOrd"
  WEIGHTS: "outputs/tips_next/frcnn_det_cuhk_cn_minor/model_final.pth"
  BACKBONE:
    NAME: "convnext_tiny_minor"
    FREEZE_AT: 1
  CONV_NEXT:
    OUT_FEATURES: ["stage1_unorm","stage2_unorm","stage3_unorm"]
    LAST_STRIDE: True
    PRETRAINED: True
    IN_22K: True
    CHECKPOINT_AT: 2
  RPN:
    IN_FEATURES: ["stage3_unorm"]
  ROI_HEADS:
    IN_FEATURES: ["stage3_unorm"]
REID_HEAD:
  LOSS:
    OIM:
      LUT_LEN: 5532
      QUEUE_LEN: 5000
SOLVER:
  MAX_ITER: 67261 # 2242 * 30 +1
  STEPS: (17936,)
  BASE_LR: 0.001
  IMS_PER_BATCH: 5
  CHECKPOINT_PERIOD: 2242
  WARMUP_ITERS: 2242
DATASETS:
  TRAIN: ("CUHK-SYSU_Train",) 
  TEST: ( "CUHK-SYSU_Gallery","CUHK-SYSU_InfQ_TestG100",) #
TEST:
  EVAL_PERIOD: 2242
OUTPUT_DIR: "outputs/tips_next/tips_minor_cn_cuhk"